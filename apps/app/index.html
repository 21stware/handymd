<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Untitled</title>
    <meta name="description" content="handymd — source-fidelity Markdown writing." />
    <meta name="theme-color" content="#faf8f4" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Immersive writing surface — no chrome. File ops via shortcuts / drag-drop. -->
    <div id="editor" class="editor-mount" aria-label="Markdown editor"></div>

    <!-- Tiny ephemeral status (filename · save) — auto-hides -->
    <div id="status" class="status" hidden aria-live="polite"></div>

    <div class="drop-overlay" id="drop-overlay" hidden aria-hidden="true">
      <div class="drop-card">Drop to open</div>
    </div>

    <input
      type="file"
      id="file-input"
      class="sr-only"
      accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain"
    />

    <script type="module" src="./main.ts"></script>
  </body>
</html>
