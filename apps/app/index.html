<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Untitled</title>
    <meta name="description" content="handymd — source-fidelity Markdown writing." />
    <meta name="theme-color" content="#f3f1ec" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scroll-root" id="scroll-root">
      <div class="page" id="page">
        <div id="editor" class="editor-mount" aria-label="Markdown editor"></div>
      </div>
    </div>

    <div id="status" class="status" hidden aria-live="polite"></div>

    <div class="corner-chrome" aria-label="文件操作">
      <button type="button" class="ghost-btn secondary-action" id="new-btn" title="新建">新建</button>
      <button type="button" class="ghost-btn" id="open-btn" title="打开">打开</button>
      <button type="button" class="ghost-btn" id="save-btn" title="保存">保存</button>
    </div>

    <div class="drop-overlay" id="drop-overlay" hidden aria-hidden="true">
      <div class="drop-card">放开以打开 Markdown</div>
    </div>

    <input
      type="file"
      id="file-input"
      class="sr-only"
      accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain"
    />

    <script type="module" src="./main.ts"></script>
  </body>
</html>
