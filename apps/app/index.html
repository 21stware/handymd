<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Untitled</title>
    <meta name="description" content="handymd — source-fidelity Markdown writing." />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <a class="app-brand" href="../" aria-label="返回 handymd 官网">
        <span class="brand-mark" aria-hidden="true">h</span>
        <span>handymd</span>
      </a>
      <div class="document-state">
        <span class="state-dot" id="state-dot" data-status="clean"></span>
        <span class="document-name" id="document-name">Untitled.md</span>
        <span class="document-meta" id="document-meta">unsaved</span>
      </div>
      <div class="app-actions">
        <button type="button" class="tool-btn secondary-action" id="new-btn" title="新建 (⌘N)">新建</button>
        <button type="button" class="tool-btn" id="open-btn" title="打开 (⌘O)">打开</button>
        <button type="button" class="tool-btn primary" id="save-btn" title="保存 (⌘S)">保存</button>
      </div>
    </header>

    <div class="scroll-root" id="scroll-root">
      <main class="workspace">
        <div class="page" id="page">
          <div class="page-ruler" aria-hidden="true"><span>MARKDOWN</span><span>LOCAL FIRST</span></div>
          <div id="editor" class="editor-mount" aria-label="Markdown editor"></div>
        </div>
      </main>
      <div class="workspace-caption" aria-hidden="true">
        <span>YOUR WORDS</span><span>YOUR SOURCE</span>
      </div>
    </div>

    <div id="status" class="status" hidden aria-live="polite"></div>

    <button
      type="button"
      class="settings-btn"
      id="settings-btn"
      aria-label="设置"
      aria-expanded="false"
      aria-controls="settings-panel"
      title="设置 (⌘,)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
        />
      </svg>
    </button>

    <div class="settings-backdrop" id="settings-backdrop" hidden></div>
    <div
      class="settings-panel"
      id="settings-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      hidden
    >
      <div class="settings-heading">
        <span>Writing preferences</span>
        <h2 id="settings-title">偏好设置</h2>
      </div>

      <div class="settings-row">
        <label for="set-theme">主题</label>
        <select id="set-theme">
          <option value="paper">纸色</option>
          <option value="sepia">羊皮纸</option>
          <option value="light">亮色</option>
          <option value="dark">深色</option>
        </select>
      </div>

      <div class="settings-row">
        <label for="set-font">字体</label>
        <select id="set-font">
          <option value="sans">系统无衬线</option>
          <option value="serif">衬线</option>
          <option value="song">宋体</option>
          <option value="mono">等宽</option>
        </select>
      </div>

      <div class="settings-row with-value">
        <label for="set-size">字号</label>
        <input id="set-size" type="range" min="13" max="28" step="1" />
        <span class="settings-value" id="set-size-val">17</span>
      </div>

      <div class="settings-row with-value">
        <label for="set-leading">行距</label>
        <input id="set-leading" type="range" min="1.3" max="2.4" step="0.05" />
        <span class="settings-value" id="set-leading-val">1.80</span>
      </div>

      <div class="settings-row with-value">
        <label for="set-width">栏宽</label>
        <input id="set-width" type="range" min="480" max="1100" step="20" />
        <span class="settings-value" id="set-width-val">720</span>
      </div>

      <p class="settings-hint">
        <kbd>⌘O</kbd> 打开 · <kbd>⌘S</kbd> 保存 · <kbd>⌘N</kbd> 新建 · <kbd>⌘,</kbd> 设置
      </p>
    </div>

    <div class="drop-overlay" id="drop-overlay" hidden aria-hidden="true">
      <div class="drop-card">Drop to open</div>
    </div>

    <input
      type="file"
      id="file-input"
      class="sr-only"
      accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain"
    />

    <script type="module" src="./main.ts"></script>
  </body>
</html>
