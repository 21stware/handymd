<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handy</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="笔记列表">
        <div class="sidebar-drag" data-tauri-drag-region>
          <button type="button" class="icon-btn" id="new-btn" title="新建笔记 ⌘N" aria-label="新建笔记">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M11.2 2.3a1.55 1.55 0 0 1 2.2 2.2l-7 7L3 12.6l1.1-3.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M2.6 14h10.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="search">
          <svg class="search-icon" width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
            <circle cx="5.6" cy="5.6" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8.6 8.6 12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="搜索笔记"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索笔记"
          />
          <button type="button" class="search-clear" id="search-clear" hidden aria-label="清除搜索">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="list-scroll">
          <ul class="note-list" id="note-list" aria-live="polite"></ul>
          <div class="list-empty" id="list-empty" hidden></div>
        </div>

        <footer class="sidebar-foot">
          <span class="foot-count" id="foot-count"></span>
          <span class="foot-vault" id="vault-badge" title="">
            <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M4 10.5a2.6 2.6 0 0 1-.1-5.2 3.3 3.3 0 0 1 6.3-.7 2.4 2.4 0 0 1-.3 5.9z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
            <span id="vault-label">Local</span>
          </span>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar" data-tauri-drag-region>
          <div class="topbar-spacer" data-tauri-drag-region></div>
          <div class="topbar-actions">
            <span class="save-dot" id="save-dot" data-state="clean" title="已保存"></span>
            <button type="button" class="icon-btn" id="pin-btn" title="置顶 ⌘⇧P" aria-label="置顶">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M9.7 1.4 14.6 6.3l-2 .5a2.2 2.2 0 0 0-1 .6L9.4 9.6l.3 2.4-3.7-3.7-4 4 4-4L2.3 4.6l2.4.3 2.2-2.2a2.2 2.2 0 0 0 .6-1z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" id="export-btn" title="导出 ⌘⇧E" aria-label="导出">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 10.5V2m0 0L5.2 4.8M8 2l2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2.5 10v2.6a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" id="delete-btn" title="删除笔记" aria-label="删除笔记">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.8 4.3h10.4M6.2 4.3V3.1a.9.9 0 0 1 .9-.9h1.8a.9.9 0 0 1 .9.9v1.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <path d="M4.2 4.3 4.8 13a.9.9 0 0 0 .9.8h4.6a.9.9 0 0 0 .9-.8l.6-8.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </header>

        <div class="scroll-root" id="scroll-root">
          <div class="page" id="page">
            <div id="editor" class="editor-mount" aria-label="Markdown editor"></div>
          </div>
        </div>

        <div class="editor-empty" id="editor-empty" hidden>
          <p class="editor-empty-title">没有打开的笔记</p>
          <p class="editor-empty-hint"><kbd>⌘</kbd><kbd>N</kbd> 新建一篇</p>
        </div>

        <div id="status" class="status" hidden aria-live="polite"></div>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
